name: Build macOS DMG and Upload to VDS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS DMG
        shell: bash
        run: |
          set -euo pipefail
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          npm run dist:mac

      - name: Verify DMG exists
        shell: bash
        run: |
          set -euo pipefail
          test -f release/BloodCraft.dmg
          ls -lah release/BloodCraft.dmg

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="manual-${GITHUB_RUN_NUMBER}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VDS_SSH_KEY }}

      - name: Add VDS host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.VDS_PORT }}" "${{ secrets.VDS_HOST }}" >> ~/.ssh/known_hosts

      - name: Create remote directory
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${{ secrets.VDS_PORT }}" "${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }}" "mkdir -p '${{ secrets.VDS_PATH }}'"

      - name: Upload stable and versioned DMG
        shell: bash
        run: |
          set -euo pipefail
          scp -P "${{ secrets.VDS_PORT }}" release/BloodCraft.dmg "${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }}:${{ secrets.VDS_PATH }}/BloodCraft.dmg"
          scp -P "${{ secrets.VDS_PORT }}" release/BloodCraft.dmg "${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }}:${{ secrets.VDS_PATH }}/BloodCraft-${{ steps.version.outputs.value }}.dmg"

      - name: Set permissions and verify on VDS
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${{ secrets.VDS_PORT }}" "${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }}" \
            "chmod 644 '${{ secrets.VDS_PATH }}/BloodCraft.dmg' '${{ secrets.VDS_PATH }}/BloodCraft-${{ steps.version.outputs.value }}.dmg' && ls -la '${{ secrets.VDS_PATH }}'"

      - name: Optional HTTP HEAD check
        shell: bash
        run: |
          set -euo pipefail
          curl -I "https://${{ secrets.VDS_HOST }}/downloads/BloodCraft.dmg" || true
