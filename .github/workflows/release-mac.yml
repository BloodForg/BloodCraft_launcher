name: Release macOS DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (example: v0.1.0). Leave empty to only build.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Build macOS DMG (with retry)
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$HOME/Library/Caches/electron" ]; then
            xattr -cr "$HOME/Library/Caches/electron" || true
          fi
          if [ -d "$HOME/Library/Caches/electron-builder" ]; then
            xattr -cr "$HOME/Library/Caches/electron-builder" || true
          fi
          xattr -cr "$GITHUB_WORKSPACE" || true

          export CSC_IDENTITY_AUTO_DISCOVERY=false
          if ! npm run dist:mac; then
            echo "Retrying dist:mac..."
            sleep 10
            if ! npm run dist:mac; then
              echo "Fallback: building .app via pack and creating DMG via hdiutil"
              npm run pack
              APP_PATH="$(find release -maxdepth 3 -type d -name 'BloodCraft.app' | head -n 1)"
              if [ -z "$APP_PATH" ]; then
                echo "BloodCraft.app not found after pack"
                exit 1
              fi
              hdiutil create -volname "BloodCraft" -srcfolder "$APP_PATH" -ov -format UDZO release/BloodCraft.dmg
            fi
          fi

      - name: Locate DMG
        id: dmg
        shell: bash
        run: |
          set -euo pipefail
          DMG_PATH=""
          for p in release/BloodCraft.dmg dist/BloodCraft.dmg; do
            if [ -f "$p" ]; then
              DMG_PATH="$p"
              break
            fi
          done

          if [ -z "$DMG_PATH" ]; then
            echo "BloodCraft.dmg was not found in release/ or dist/."
            exit 1
          fi

          if [ "$(basename "$DMG_PATH")" != "BloodCraft.dmg" ]; then
            echo "Expected file name BloodCraft.dmg, got: $(basename "$DMG_PATH")"
            exit 1
          fi

          echo "path=$DMG_PATH" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          TAG=""

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          fi

          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.tag.outputs.value != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: BloodCraft ${{ steps.tag.outputs.value }}
          files: ${{ steps.dmg.outputs.path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
