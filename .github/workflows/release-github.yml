name: Release to GitHub (macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (example: v0.1.4)'
        required: false
        type: string

jobs:
  release-mac:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Resolve ref
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "ref=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer and electron
        run: npm run build

      - name: Build and publish macOS artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --publish always

      - name: Mirror updater file to dist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp release/latest-mac.yml dist/latest-mac.yml

      - name: Verify updater files
        shell: bash
        run: |
          set -euo pipefail
          ls -lah release
          test -n "$(find release -maxdepth 1 -name '*.dmg' | head -n 1)"
          test -n "$(find release -maxdepth 1 -name '*-mac.zip' | head -n 1)"
          test -s release/latest-mac.yml
          if [ ! -f dist/latest-mac.yml ]; then
            echo "latest-mac.yml missing"
            exit 1
          fi
          ls -lah release/latest-mac.yml dist/latest-mac.yml
