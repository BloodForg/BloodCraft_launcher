name: Release to GitHub (macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (example: v0.1.4)'
        required: false
        type: string

jobs:
  release-mac:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Resolve ref
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "ref=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          case "${{ steps.ref.outputs.tag }}" in
            v*) ;;
            *)
              echo "Release tag must start with v*"
              exit 1
              ;;
          esac

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch bundled JRE 21 (macOS arm64)
        run: npm run fetch:jre

      - name: Guard appId / bundleIdentifier
        run: npm run guard:appid

      - name: Build renderer and electron
        run: npm run build

      - name: Build macOS artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --publish never

      - name: Mirror updater file to dist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp release/latest-mac.yml dist/latest-mac.yml

      - name: Verify updater files
        shell: bash
        run: |
          set -euo pipefail
          ls -lah release
          test -n "$(find release -maxdepth 1 -name '*.dmg' | head -n 1)"
          test -n "$(find release -maxdepth 1 -name '*-mac.zip' | head -n 1)"
          test -s release/latest-mac.yml
          if [ ! -f dist/latest-mac.yml ]; then
            echo "latest-mac.yml missing"
            exit 1
          fi
          ls -lah release/latest-mac.yml dist/latest-mac.yml

      - name: Verify mac zip structure (Squirrel.Mac)
        run: npm run verify:mac-zip

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ref.outputs.tag }}
          name: ${{ steps.ref.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            release/*.dmg
            release/*-mac.zip
            release/*.blockmap
            release/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
